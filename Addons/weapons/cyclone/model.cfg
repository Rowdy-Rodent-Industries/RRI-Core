class CfgModels {
	class Default {
		skeletonName = "";
		sectionsInherit = "";
		sections[] = {};
	};
	class mti_cyclone: Default {
		skeletonName = "mti_cyclone_skeleton";
		sectionsInherit = "";
		sections[] = {
			"camo1",
			"zasleh",
			"illum"
		};
		class Animations {
			class zaslehROT
			{
				type="rotation";
				source="clockMinute";
				sourceAddress="loop";
				selection="zasleh";
				begin="usti hlavne";
				end="konec hlavne";
				memory=1;
				minValue=0.0166665;
				maxValue=0.016666668;
				angle0="rad 0";
				angle1="rad 360";
			};
			class trigger_rot {
				type = "rotation";
				source = "reload";
				sourceAddress = "clamp";
				selection = "trigger";
				memory = 1;
				axis = "trigger_axis";
				minValue = 0;
				maxValue = 1;
				angle0 = 0;
				angle1 = -0.5235987755982988;
			};
		};
	};
	class mti_cyclone_magazine1: Default
	{
		skeletonName="cyclone_mag_skeleton";
		sectionsInherit="";
		sections[]=
		{
			"camo1","emissive"
		};
	};
	class mti_cyclone_magazine2: Default
	{
		skeletonName="cyclone_mag_skeleton";
		sectionsInherit="";
		sections[]=
		{
			"camo1"
		};
	};
	class mti_cyclone_bipod
	{
		skeletonName	= "mti_cyclone_bipod_skeleton";
		sectionsInherit = "";
		sections[] 		= {"bipod_leg_L","bipod_leg_R","bipod_legs"};

		class Animations
		{
			class leg_L
			{
				type			= rotation;
				source			= bipod_legs;
				sourceAddress	= clamp;
				selection		= "bipod_leg_L";
				axis			= "bipod_leg_L_axis";
				minValue		= 0;
				maxValue		= 1;
				angle0			= (rad -5);
				angle1			= (rad 18);
			};

			class leg_R: leg_L
			{
				selection		= "bipod_leg_R";
				axis			= "bipod_leg_R_axis";
			};
			class legs: leg_L
			{
				selection		= "bipod_legs";
				axis			= "bipod_legs_axis";
				angle0			= (rad 0);
				angle1			= (rad 90);
			};
			class Leg_L_move
			{
				type			= translation;
				source			= bipod_legs_length;
				selection		= "Leg_L";
				axis			= "Leg_L_axis";
				memory			= 1;
				minValue		= 0;
				maxValue		= 1;
				offset0			= 0;
				offset1			= 10;
			};	
			class Leg_R_move: Leg_L_move
			{
				selection		= "Leg_R";
				axis			= "Leg_R_axis";
			};			
		};
	};	
};

