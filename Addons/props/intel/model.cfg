class Rotation
{
    type = "Rotation";
};

class CfgSkeletons {
	class Default {
		isDiscrete = 1;
		skeletonInherit = "";
		skeletonBones[] = {};
	};
	class mti_holoprojector_skeleton: Default {
		isDiscrete = 1;
		skeletonInherit = "";
		skeletonBones[] = {
			"globe",""
		};
	};
	class mti_antenna_skeleton: Default {
		isDiscrete = 1;
		skeletonInherit = "";
		skeletonBones[] = {
			"antenna",""
		};
	};
};

class CfgModels {
	class Default {
		skeletonName = "";
		sectionsInherit = "";
		sections[] = {};
	};
	class mti_datapad: Default {
		skeletonName = "";
		sectionsInherit = "";
		sections[] = {
			"datapad",
			"buttons",
			"screen",
			"panel"
		};
		class Animations {
			 // there are no animations
		};
	};
	class mti_holoprojector: Default {
		skeletonName = "mti_holoprojector_skeleton";
		sectionsInherit = "";
		sections[] = {
			"Camo1",
			"Camo2"
		};
		class Animations
        {    
            class rotation_x: Rotation {
                source = "timeRndOffset";
                selection = "globe";
                axis = "globe_axis";
                sourceAddress = "loop";
                minValue = 0;
                maxValue = 60;
                angle0 = (rad 360);
                angle1 = 0;
            };
        };
	};
	class mti_antenna: Default {
		skeletonName = "mti_antenna_skeleton";
		sectionsInherit = "";
		sections[] = {
			"Camo1"
		};
		class Animations
        {    
            class rotation_x: Rotation {
                source = "timeRndOffset";
                selection = "antenna";
                axis = "turn_axis";
                sourceAddress = "loop";
                minValue = 0;
                maxValue = 60;
                angle0 = (rad 360);
                angle1 = 0;
            };
        };
	};
	class mti_datapad2: Default {
		skeletonName = "";
		sectionsInherit = "";
		sections[] = {
			"Camo1",
			"Screen"
		};
		class Animations {
			 // there are no animations
		};
	};
};

