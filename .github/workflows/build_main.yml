name: Build (main)

on:
  push:
    branches:
    - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the source code
      uses: actions/checkout@v3
    - name: Setup HEMTT
      uses: arma-actions/hemtt@v1
    - name: Run HEMTT build
      run: hemtt build
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-output
        path: .hemttout/*
        include-hidden-files: true
        retention-days: 1
        if-no-files-found: 'error'

  update_config_lists:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the source code
      uses: actions/checkout@v3
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: build-output
        path: .hemttout
    - name: Set up python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yapbol
    - name: Run config_lists.hpp updater
      run: python ./tools/write_config_lists.py
    - name: Push fixed files
      uses: stefanzweifel/git-auto-commit-action@v6
      with:
        commit_message: 'Automatic: Write config_lists.hpp'

  update_aceax_compat:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the source code
      uses: actions/checkout@v3
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: build-output
        path: .hemttout
    - name: Set up python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yapbol
    - name: Run aceax compat updater
      run: python ./tools/write_aceax_compat.py
    - name: Push fixed files
      uses: stefanzweifel/git-auto-commit-action@v6
      with:
        commit_message: 'Automatic: Write XtdGearModels.hpp'

  check_paths:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the source code
      uses: actions/checkout@v3
      with:
        sparse-checkout: |
          tools/utils
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: build-output
        path: .hemttout
    - name: Set up python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yapbol
    - name: Run file path checker
      run: python ./tools/check_paths.py

  check_classes:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the source code
      uses: actions/checkout@v3
      with:
        sparse-checkout: |
          tools/utils
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: build-output
        path: .hemttout
    - name: Set up python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yapbol
    - name: Run file path checker
      run: python ./tools/check_classes.py

  cleanup_artifacts:
    needs: [check_paths, check_classes,update_config_lists,update_aceax_compat]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
    - name: Call workflow to delete artifacts
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        curl --fail --show-error --location \
          --request POST "https://api.github.com/repos/$GITHUB_REPOSITORY/dispatches" \
          --header "Authorization: Bearer $GH_TOKEN" \
          --header "Content-Type: application/json" \
          --header "Accept: application/vnd.github+json" \
          --data-raw "{ \"event_type\": \"delete_all_artifacts\", \"client_payload\": {\"parent_runid\": \"$GITHUB_RUN_ID\", \"parent_repo\": \"$GITHUB_REPOSITORY\"} }"